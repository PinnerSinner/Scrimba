<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e8f5f0;
        }

        .container {
            width: 380px;
            border: 3px solid #121212;
            padding: 20px;
            text-align: center;
            background-color: white;
        }

        h1 {
            color: #121212;
            margin-top: 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        img {
            width: 380px;
            display: block;
        }

        p {
            color: #121212;
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
        }

        input {
            width: 230px;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #121212;
            text-align: center;
        }

        input::placeholder {
            color: #888;
        }

        button {
            width: 250px;
            margin-top: 10px;
            color: white;
            background: #121212;
            border: none;
            padding: 15px 0;
            font-weight: bold;
            cursor: pointer;
        }

        .terms {
            font-size: 12px;
            margin-top: 15px;
        }

        a {
            color: #121212;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>THE DAILY DRIBBLE</h1>
        <!-- Image placeholder since we can't use the actual file -->
        <img src="stadium.jpg" alt="Soccer stadium" />
        <p>Your daily dose of soccer stories from on and off the pitch. Interviews, analyses, breaking news and more!
        </p>
        <input type="text" placeholder="ENTER YOUR EMAIL">
        <button>JOIN NOW</button>
        <p class="terms">Read our <a href="#" target="_blank">terms of service.</a></p>
    </div>
</body>

</html>
